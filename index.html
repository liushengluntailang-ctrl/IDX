<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Alpine Custom Project IDX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; height: 100vh; background: #1e1e1e; color: #cccccc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; overflow: hidden; }
        
        #activity-bar { width: 48px; background: #333333; display: flex; flex-direction: column; align-items: center; padding-top: 10px; border-right: 1px solid #252525; }
        .act-btn { width: 48px; height: 48px; display: flex; justify-content: center; align-items: center; color: #858585; cursor: pointer; font-size: 20px; transition: 0.2s; }
        .act-btn:hover, .act-btn.active { color: #ffffff; }
        .act-btn.run-btn { color: #4ec9b0; }
        .act-btn.run-btn:hover { color: #85e8d3; transform: scale(1.1); }
        .act-btn.ui-btn { color: #e5c07b; }

        #sidebar { width: 240px; background: #252526; display: flex; flex-direction: column; border-right: 1px solid #191919; }
        #sidebar-header { padding: 10px 15px; font-size: 11px; font-weight: bold; text-transform: uppercase; color: #bbbbbb; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2d2d; }
        .sidebar-actions i { margin-left: 10px; cursor: pointer; }
        .sidebar-actions i:hover { color: #fff; }
        #file-tree { flex: 1; overflow-y: auto; padding-top: 5px; list-style: none; }
        
        /* ファイルツリー & 削除ボタン */
        .tree-item { padding: 4px 15px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 13px; position: relative; }
        .tree-item:hover { background: #2a2d2e; }
        .tree-item.active { background: #37373d; color: #fff; }
        .tree-item .left-group { display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tree-item .delete-btn { display: none; color: #e06c75; font-size: 12px; padding: 2px 5px; }
        .tree-item:hover .delete-btn { display: block; }
        .tree-item .delete-btn:hover { color: #ff3344; transform: scale(1.2); }

        #workspace-area { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }
        #tabs-bar { height: 35px; background: #252526; display: flex; align-items: center; justify-content: space-between; padding-right: 10px; border-bottom: 1px solid #1e1e1e; }
        .tab { height: 100%; padding: 0 16px; background: #1e1e1e; color: #ffffff; display: flex; align-items: center; gap: 8px; font-size: 13px; border-top: 2px solid #007acc; }

        #center-split { flex: 1; display: flex; position: relative; overflow: hidden; }
        #editor-container { flex: 1; height: 100%; position: relative; }
        #monaco-editor { width: 100%; height: 100%; }

        /* メディアビューアー (MP3/MP4/画像用) */
        #media-viewer { display: none; width: 100%; height: 100%; background: #181818; align-items: center; justify-content: center; flex-direction: column; gap: 15px; }
        #media-viewer video { max-width: 90%; max-height: 80%; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        #media-viewer audio { width: 80%; }
        #media-viewer img { max-width: 90%; max-height: 80%; object-fit: contain; }

        #preview-panel { width: 420px; height: 100%; background: #121212; border-left: 2px solid #333; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        #preview-header { width: 100%; height: 26px; color: #aaa; display: flex; align-items: center; justify-content: space-between; font-size: 11px; margin-bottom: 5px; }
        #preview-viewport { width: 100%; height: calc(100% - 35px); background: #000; border: 2px solid #444; border-radius: 8px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        #preview-frame { flex: 1; border: none; width: 100%; height: 100%; background: #fff; }

        /* 本物の対話型ターミナル */
        #terminal-panel { height: 200px; background: #141414; border-top: 1px solid #333; display: flex; flex-direction: column; font-family: "Consolas", monospace; }
        #terminal-header { height: 26px; background: #1e1e1e; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 11px; font-weight: bold; color: #aaa; border-bottom: 1px solid #2a2a2a; }
        #terminal-body { flex: 1; padding: 10px; overflow-y: auto; font-size: 13px; color: #d4d4d4; white-space: pre-wrap; }
        #terminal-input-line { display: flex; align-items: center; background: #181818; padding: 4px 10px; border-top: 1px solid #282828; }
        #terminal-prompt { color: #4ec9b0; font-weight: bold; font-size: 13px; margin-right: 8px; }
        #cmd-input { flex: 1; background: transparent; border: none; color: #fff; font-family: inherit; font-size: 13px; outline: none; }

        #modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: rgba(0,0,0,0.3); }
        #quick-input-box { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 450px; background: #252526; border: 1px solid #007acc; padding: 8px; }
        #quick-input { width: 100%; background: #3c3c3c; border: 1px solid #3c3c3c; color: #fff; font-size: 13px; padding: 6px; outline: none; }
    </style>
</head>
<body>

    <div id="modal-overlay">
        <div id="quick-input-box">
            <span id="quick-input-label" style="font-size:11px; color:#888;">ファイル名を入力</span>
            <input type="text" id="quick-input" autocomplete="off" />
        </div>
    </div>

    <!-- 1. Activity Bar -->
    <div id="activity-bar">
        <div class="act-btn active" title="Explorer"><i class="fa-regular fa-copy"></i></div>
        <div class="act-btn run-btn" id="sidebar-run-btn" title="プロジェクト実行 (Run)"><i class="fa-solid fa-play"></i></div>
        <div class="act-btn ui-btn" id="toggle-preview-btn" title="UIプレビュー切替"><i class="fa-solid fa-window-restore"></i></div>
    </div>

    <!-- 2. Sidebar -->
    <div id="sidebar">
        <div id="sidebar-header">
            <span>PROJECT EXPLORER</span>
            <div class="sidebar-actions">
                <i class="fa-solid fa-file-circle-plus" id="new-file-btn" title="新規ファイル"></i>
                <i class="fa-solid fa-folder-plus" id="new-folder-btn" title="新規フォルダ"></i>
                <i class="fa-solid fa-rotate" id="refresh-tree-btn"></i>
            </div>
        </div>
        <ul id="file-tree"></ul>
    </div>

    <!-- 3. Workspace Area -->
    <div id="workspace-area">
        <div id="tabs-bar">
            <div class="tab">
                <i class="fa-solid fa-code"></i>
                <span id="tab-filename">ファイルを選択</span>
            </div>
            <div>
                <button id="render-ui-btn" style="background:#007acc; color:#fff; border:none; padding:4px 10px; font-size:11px; cursor:pointer; border-radius:2px;">
                    <i class="fa-solid fa-rotate-right"></i> UI更新
                </button>
            </div>
        </div>

        <div id="center-split">
            <!-- テキストエディタ -->
            <div id="editor-container">
                <div id="monaco-editor"></div>
                <!-- メディア専用プレイヤー (MP3/MP4/画像用) -->
                <div id="media-viewer"></div>
            </div>

            <!-- UI プレビュー (SVG/HTML/QML/SwiftUI) -->
            <div id="preview-panel">
                <div id="preview-header">
                    <span id="preview-title"><i class="fa-solid fa-layer-group"></i> UI Simulator / Preview</span>
                    <span id="preview-status" style="color:#4ec9b0;">Live</span>
                </div>
                <div id="preview-viewport">
                    <iframe id="preview-frame" sandbox="allow-scripts allow-modals"></iframe>
                </div>
            </div>
        </div>

        <!-- 4. 本物の対話型Linuxターミナル -->
        <div id="terminal-panel">
            <div id="terminal-header">
                <span>INTERACTIVE TERMINAL (Alpine Linux /bin/sh)</span>
                <span id="clear-term" style="cursor:pointer;"><i class="fa-solid fa-ban"></i></span>
            </div>
            <div id="terminal-body">// Alpine Linux シェル対話環境です。コマンドを入力してEnterで即時実行されます。</div>
            <div id="terminal-input-line">
                <span id="terminal-prompt">alpine:/workspace#</span>
                <input type="text" id="cmd-input" placeholder="ls -la, git status, dotnet --info, etc..." autocomplete="off" />
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script>
        let editor;
        let activePath = "";
        const terminalBody = document.getElementById("terminal-body");
        const cmdInput = document.getElementById("cmd-input");
        const previewFrame = document.getElementById("preview-frame");
        const previewTitle = document.getElementById("preview-title");
        const mediaViewer = document.getElementById("media-viewer");
        const monacoContainer = document.getElementById("monaco-editor");

        const langMap = {
            'cs': 'csharp', 'py': 'python', 'go': 'go', 'rs': 'rust',
            'cpp': 'cpp', 'c': 'c', 'js': 'javascript', 'html': 'html',
            'xml': 'xml', 'svg': 'xml', 'kt': 'kotlin', 'swift': 'swift', 'qml': 'javascript', 'json': 'json'
        };

        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(monacoContainer, {
                value: '// ファイルを開いてください',
                language: 'plaintext',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14
            });

            let timer;
            editor.onDidChangeModelContent(() => {
                if (!activePath) return;
                clearTimeout(timer);
                timer = setTimeout(() => {
                    saveFile();
                    if (['svg', 'html', 'swift', 'qml'].some(ext => activePath.endsWith('.' + ext))) {
                        executeUIRuntime();
                    }
                }, 600);
            });

            loadTree();
        });

        async function saveFile() {
            if (!activePath) return;
            await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: activePath, content: editor.getValue() })
            });
        }

        // ファイルツリーの読み込み（削除ボタン付き）
        async function loadTree() {
            const res = await fetch('/api/files');
            const files = await res.json();
            const tree = document.getElementById('file-tree');
            tree.innerHTML = "";
            if (!files) return;

            files.forEach(f => {
                const li = document.createElement('li');
                li.className = 'tree-item' + (f.path === activePath ? ' active' : '');
                
                const ext = f.name.split('.').pop().toLowerCase();
                let icon = f.isDir ? 'fa-regular fa-folder' : 'fa-regular fa-file-code';
                if (['mp3', 'wav', 'ogg'].includes(ext)) icon = 'fa-solid fa-music';
                else if (['mp4', 'webm'].includes(ext)) icon = 'fa-solid fa-video';
                else if (['svg', 'png', 'jpg'].includes(ext)) icon = 'fa-solid fa-image';

                li.innerHTML = `
                    <div class="left-group">
                        <i class="${icon}"></i> <span>${f.path}</span>
                    </div>
                    <i class="fa-solid fa-trash delete-btn" title="削除"></i>
                `;

                li.querySelector('.left-group').onclick = () => openFile(f.path);
                
                // ★ 1. ファイル削除機能
                li.querySelector('.delete-btn').onclick = async (e) => {
                    e.stopPropagation();
                    if (confirm(`本当に "${f.path}" を完全に削除しますか？`)) {
                        await fetch('/api/delete', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ path: f.path })
                        });
                        if (activePath === f.path) {
                            activePath = "";
                            editor.setValue("");
                            document.getElementById('tab-filename').innerText = "ファイルを選択";
                        }
                        loadTree();
                    }
                };

                tree.appendChild(li);
            });
        }

        // ★ 3 & 4. ファイルオープン（テキスト vs メディア自動判別）
        async function openFile(path) {
            activePath = path;
            document.getElementById('tab-filename').innerText = path;
            const ext = path.split('.').pop().toLowerCase();

            // メディアファイル（MP3 / MP4 / 画像）の判定
            if (['mp3', 'wav', 'ogg', 'mp4', 'webm', 'png', 'jpg', 'jpeg'].includes(ext)) {
                monacoContainer.style.display = 'none';
                mediaViewer.style.display = 'flex';
                const fileUrl = `/api/raw?path=${encodeURIComponent(path)}&t=${Date.now()}`;

                if (['mp3', 'wav', 'ogg'].includes(ext)) {
                    mediaViewer.innerHTML = `
                        <div style="font-size:40px; color:#4ec9b0;"><i class="fa-solid fa-music"></i></div>
                        <h3 style="color:#fff;">${path}</h3>
                        <audio controls src="${fileUrl}" autoplay style="margin-top:15px;"></audio>
                    `;
                } else if (['mp4', 'webm'].includes(ext)) {
                    mediaViewer.innerHTML = `
                        <video controls src="${fileUrl}" autoplay style="width:85%; max-height:80%;"></video>
                        <span style="color:#888; font-size:12px;">${path}</span>
                    `;
                } else {
                    mediaViewer.innerHTML = `<img src="${fileUrl}" alt="${path}" />`;
                }
            } else {
                // 通常のテキスト/コード/XML/SVG
                mediaViewer.style.display = 'none';
                monacoContainer.style.display = 'block';

                const res = await fetch(`/api/load?path=${encodeURIComponent(path)}`);
                const content = await res.text();
                editor.setValue(content);
                monaco.editor.setModelLanguage(editor.getModel(), langMap[ext] || 'plaintext');
            }

            document.querySelectorAll('.tree-item').forEach(el => {
                const span = el.querySelector('span');
                if (span) el.classList.toggle('active', span.innerText === path);
            });

            executeUIRuntime();
        }

        // ★ SVG / XML / SwiftUI / Qt プレビューレンダラー
        function executeUIRuntime() {
            const code = editor.getValue();
            const ext = activePath.split('.').pop().toLowerCase();

            // SVG / XML のプレビュー
            if (ext === 'svg') {
                previewTitle.innerHTML = '<i class="fa-solid fa-bezier-curve"></i> SVG Vector Preview';
                previewFrame.srcdoc = `<html><body style="margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#1e1e1e;">${code}</body></html>`;
                return;
            }
            if (ext === 'html') {
                previewTitle.innerHTML = '<i class="fa-brands fa-html5"></i> Web Preview';
                previewFrame.srcdoc = code;
                return;
            }

            // QML
            if (ext === 'qml') {
                previewTitle.innerHTML = '<i class="fa-solid fa-cubes"></i> Qt Quick Window';
                previewFrame.srcdoc = `<!DOCTYPE html><html><head><style>body { margin:0; padding:20px; background:#2b2b2b; color:#fff; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; } .qt-btn { background:#4a4e52; color:#fff; border:1px solid #5a5e62; padding:8px 16px; border-radius:4px; cursor:pointer; font-weight:bold; }</style></head><body><div id="qt-root"></div><script>const qml = ${JSON.stringify(code)}; const state = {}; const pMatch = qml.match(/property\\s+int\\s+([a-zA-Z0-9_]+)\\s*:\\s*([0-9]+)/); if (pMatch) state[pMatch[1]] = parseInt(pMatch[2]); function render() { let html = '<div style="font-size:20px; font-weight:bold; margin-bottom:15px;">Qt QML Window</div>'; for (let k in state) { html += '<div style="font-size:18px; margin-bottom:10px;">Count: ' + state[k] + '</div>'; } html += '<button class="qt-btn" onclick="state.count++; render();">Qt PushButton (Click)</button>'; document.getElementById('qt-root').innerHTML = html; } render();<\/script></body></html>`;
                return;
            }

            // SwiftUI
            if (ext === 'swift') {
                previewTitle.innerHTML = '<i class="fa-brands fa-apple"></i> SwiftUI Simulator';
                previewFrame.srcdoc = `<!DOCTYPE html><html><head><script src="https://cdn.tailwindcss.com"></` + `script></head><body class="bg-gray-100 flex flex-col justify-center items-center h-screen"><div id="root" class="text-center"></div><script>let count = 0; function render() { document.getElementById('root').innerHTML = '<h2 class="text-xl font-bold mb-2">SwiftUI Native View</h2><div class="text-gray-600 mb-4 font-semibold">Count: ' + count + '</div><button onclick="count++; render();" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl shadow active:scale-95 font-bold">Action Button</button>'; } render();<\/script></body></html>`;
            }
        }

        document.getElementById('render-ui-btn').onclick = executeUIRuntime;
        document.getElementById('toggle-preview-btn').onclick = () => {
            const panel = document.getElementById('preview-panel');
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        };

        // ★ 2. 本物の対話型ターミナル実行処理
        cmdInput.onkeydown = async (e) => {
            if (e.key === 'Enter') {
                const cmd = cmdInput.value.trim();
                if (!cmd) return;
                cmdInput.value = "";

                terminalBody.innerText += `\nalpine:/workspace# ${cmd}\n`;
                terminalBody.scrollTop = terminalBody.scrollHeight;

                try {
                    const res = await fetch('/api/cmd', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ cmd })
                    });
                    const out = await res.text();
                    terminalBody.innerText += out;
                    terminalBody.scrollTop = terminalBody.scrollHeight;
                    loadTree(); // コマンドでファイルが作成・削除された場合にツリーを即時更新
                } catch (err) {
                    terminalBody.innerText += `Error: ${err}\n`;
                }
            }
        };

        document.getElementById('clear-term').onclick = () => terminalBody.innerText = "// ターミナルをクリアしました";

        // プロジェクトビルド (サイドバー [▶])
        document.getElementById('sidebar-run-btn').onclick = async () => {
            if (!activePath) return;
            terminalBody.innerText += `\n[Building Project] ${activePath} ...\n-----------------------------------\n`;
            await saveFile();

            try {
                const res = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: activePath })
                });
                const result = await res.text();
                terminalBody.innerText += result + `\n-----------------------------------\n[Done]\n`;
                terminalBody.scrollTop = terminalBody.scrollHeight;
            } catch (err) {
                terminalBody.innerText += `Build Error: ${err}\n`;
            }
        };

        // 新規作成モーダル
        const overlay = document.getElementById('modal-overlay');
        const input = document.getElementById('quick-input');
        const label = document.getElementById('quick-input-label');
        let currentAction = null;

        function showPrompt(title, onConfirm) {
            label.innerText = title;
            input.value = "";
            overlay.style.display = 'block';
            input.focus();
            currentAction = onConfirm;
        }

        input.onkeydown = (e) => {
            if (e.key === 'Enter') {
                const val = input.value.trim();
                overlay.style.display = 'none';
                if (val && currentAction) currentAction(val);
            } else if (e.key === 'Escape') overlay.style.display = 'none';
        };

        document.getElementById('new-file-btn').onclick = () => {
            showPrompt("新規ファイル名 (例: icon.svg, layout.xml, sound.mp3)", async (name) => {
                await fetch('/api/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: name, isDir: false })
                });
                await loadTree();
                openFile(name);
            });
        };

        document.getElementById('new-folder-btn').onclick = () => {
            showPrompt("新規フォルダ名", async (name) => {
                await fetch('/api/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: name, isDir: true })
                });
                await loadTree();
            });
        };

        document.getElementById('refresh-tree-btn').onclick = loadTree;
    </script>
</body>
</html>
