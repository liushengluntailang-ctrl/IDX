<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Alpine Custom Project IDX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; height: 100vh; background: #1e1e1e; color: #cccccc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; overflow: hidden; }
        
        #activity-bar { width: 48px; background: #333333; display: flex; flex-direction: column; align-items: center; padding-top: 10px; border-right: 1px solid #252525; }
        .act-btn { width: 48px; height: 48px; display: flex; justify-content: center; align-items: center; color: #858585; cursor: pointer; font-size: 20px; transition: 0.2s; }
        .act-btn:hover, .act-btn.active { color: #ffffff; }
        .act-btn.run-btn { color: #4ec9b0; }
        .act-btn.run-btn:hover { color: #85e8d3; transform: scale(1.1); }
        .act-btn.ui-btn { color: #e5c07b; }

        #sidebar { width: 230px; background: #252526; display: flex; flex-direction: column; border-right: 1px solid #191919; }
        #sidebar-header { padding: 10px 15px; font-size: 11px; font-weight: bold; text-transform: uppercase; color: #bbbbbb; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2d2d; }
        .sidebar-actions i { margin-left: 10px; cursor: pointer; }
        .sidebar-actions i:hover { color: #fff; }
        #file-tree { flex: 1; overflow-y: auto; padding-top: 5px; list-style: none; }
        .tree-item { padding: 4px 15px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .tree-item:hover { background: #2a2d2e; }
        .tree-item.active { background: #37373d; color: #fff; }

        #workspace-area { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }
        #tabs-bar { height: 35px; background: #252526; display: flex; align-items: center; justify-content: space-between; padding-right: 10px; border-bottom: 1px solid #1e1e1e; }
        .tab { height: 100%; padding: 0 16px; background: #1e1e1e; color: #ffffff; display: flex; align-items: center; gap: 8px; font-size: 13px; border-top: 2px solid #007acc; }

        #center-split { flex: 1; display: flex; position: relative; overflow: hidden; }
        #editor-container { flex: 1; height: 100%; position: relative; }
        #monaco-editor { width: 100%; height: 100%; }

        /* 右側プレビュー */
        #preview-panel { width: 420px; height: 100%; background: #121212; border-left: 2px solid #333; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        #preview-header { width: 100%; height: 26px; color: #aaa; display: flex; align-items: center; justify-content: space-between; font-size: 11px; margin-bottom: 5px; }
        
        #preview-viewport { width: 100%; height: calc(100% - 35px); background: #000; border: 2px solid #444; border-radius: 8px; overflow: hidden; position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.7); display: flex; flex-direction: column; }
        #preview-frame { flex: 1; border: none; width: 100%; height: 100%; background: #fff; }

        #terminal-panel { height: 170px; background: #181818; border-top: 1px solid #333; display: flex; flex-direction: column; }
        #terminal-header { height: 26px; background: #222222; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 11px; font-weight: bold; color: #aaa; }
        #terminal-output { flex: 1; padding: 10px; font-family: "Consolas", monospace; font-size: 13px; color: #d4d4d4; overflow-y: auto; white-space: pre-wrap; }

        #modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: rgba(0,0,0,0.3); }
        #quick-input-box { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 450px; background: #252526; border: 1px solid #007acc; padding: 8px; }
        #quick-input { width: 100%; background: #3c3c3c; border: 1px solid #3c3c3c; color: #fff; font-size: 13px; padding: 6px; outline: none; }
    </style>
</head>
<body>

    <div id="modal-overlay">
        <div id="quick-input-box">
            <span id="quick-input-label" style="font-size:11px; color:#888;">ファイル名を入力</span>
            <input type="text" id="quick-input" autocomplete="off" />
        </div>
    </div>

    <!-- 1. Activity Bar -->
    <div id="activity-bar">
        <div class="act-btn active" title="Explorer"><i class="fa-regular fa-copy"></i></div>
        <div class="act-btn run-btn" id="sidebar-run-btn" title="プロジェクト丸ごとビルド＆実行 (Run Project)"><i class="fa-solid fa-play"></i></div>
        <div class="act-btn ui-btn" id="toggle-preview-btn" title="UI プレビュー切り替え"><i class="fa-solid fa-window-restore"></i></div>
    </div>

    <!-- 2. Sidebar -->
    <div id="sidebar">
        <div id="sidebar-header">
            <span>PROJECT EXPLORER</span>
            <div class="sidebar-actions">
                <i class="fa-solid fa-file-circle-plus" id="new-file-btn" title="新規ファイル"></i>
                <i class="fa-solid fa-folder-plus" id="new-folder-btn" title="新規フォルダ"></i>
                <i class="fa-solid fa-rotate" id="refresh-tree-btn"></i>
            </div>
        </div>
        <ul id="file-tree"></ul>
    </div>

    <!-- 3. Workspace Area -->
    <div id="workspace-area">
        <div id="tabs-bar">
            <div class="tab">
                <i class="fa-solid fa-code"></i>
                <span id="tab-filename">ファイルを選択</span>
            </div>
            <div>
                <button id="render-ui-btn" style="background:#007acc; color:#fff; border:none; padding:4px 10px; font-size:11px; cursor:pointer; border-radius:2px;">
                    <i class="fa-solid fa-rotate-right"></i> UI更新
                </button>
            </div>
        </div>

        <div id="center-split">
            <div id="editor-container">
                <div id="monaco-editor"></div>
            </div>

            <!-- UI プレビュー -->
            <div id="preview-panel">
                <div id="preview-header">
                    <span id="preview-title"><i class="fa-solid fa-layer-group"></i> Native UI Simulator</span>
                    <span id="preview-status" style="color:#4ec9b0;">Interactive</span>
                </div>
                <div id="preview-viewport">
                    <iframe id="preview-frame" sandbox="allow-scripts allow-modals"></iframe>
                </div>
            </div>
        </div>

        <!-- ターミナル -->
        <div id="terminal-panel">
            <div id="terminal-header">
                <span>PROJECT BUILD OUTPUT</span>
                <span id="clear-term" style="cursor:pointer;"><i class="fa-solid fa-ban"></i></span>
            </div>
            <div id="terminal-output">// [▶] ボタンでディレクトリ全体のプロジェクトを一括ビルド＆実行します</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script>
        let editor;
        let activePath = "";
        const output = document.getElementById("terminal-output");
        const previewFrame = document.getElementById("preview-frame");
        const previewTitle = document.getElementById("preview-title");

        const langMap = {
            'cs': 'csharp', 'py': 'python', 'go': 'go', 'rs': 'rust',
            'cpp': 'cpp', 'c': 'c', 'js': 'javascript', 'html': 'html',
            'kt': 'kotlin', 'swift': 'swift', 'qml': 'javascript'
        };

        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('monaco-editor'), {
                value: '// ファイルを開いてください',
                language: 'plaintext',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14
            });

            let timer;
            editor.onDidChangeModelContent(() => {
                if (!activePath) return;
                clearTimeout(timer);
                timer = setTimeout(() => {
                    saveFile();
                    if (activePath.endsWith('.swift') || activePath.endsWith('.qml') || activePath.endsWith('.html')) {
                        executeUIRuntime();
                    }
                }, 600);
            });

            loadTree();
        });

        async function saveFile() {
            if (!activePath) return;
            await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: activePath, content: editor.getValue() })
            });
        }

        async function loadTree() {
            const res = await fetch('/api/files');
            const files = await res.json();
            const tree = document.getElementById('file-tree');
            tree.innerHTML = "";
            if (!files) return;

            files.forEach(f => {
                const li = document.createElement('li');
                li.className = 'tree-item' + (f.path === activePath ? ' active' : '');
                li.innerHTML = `<i class="${f.isDir ? 'fa-regular fa-folder' : 'fa-regular fa-file-code'}"></i> <span>${f.path}</span>`;
                if (!f.isDir) li.onclick = () => openFile(f.path);
                tree.appendChild(li);
            });

            if (!activePath && files.length > 0) {
                const first = files.find(f => !f.isDir);
                if (first) openFile(first.path);
            }
        }

        async function openFile(path) {
            activePath = path;
            document.getElementById('tab-filename').innerText = path;
            const res = await fetch(`/api/load?path=${encodeURIComponent(path)}`);
            const content = await res.text();
            
            const ext = path.split('.').pop().toLowerCase();
            editor.setValue(content);
            monaco.editor.setModelLanguage(editor.getModel(), langMap[ext] || 'plaintext');

            document.querySelectorAll('.tree-item').forEach(el => {
                el.classList.toggle('active', el.querySelector('span').innerText === path);
            });

            executeUIRuntime();
        }

        // ★ SwiftUI & Qt QML の完全インタラクティブ実行エンジン
        function executeUIRuntime() {
            const code = editor.getValue();
            const ext = activePath.split('.').pop().toLowerCase();

            if (ext === 'html') {
                previewTitle.innerHTML = '<i class="fa-brands fa-html5"></i> Web Preview';
                previewFrame.srcdoc = code;
                return;
            }

            // --- 1. Qt Quick / QML 実行ランタイム ---
            if (ext === 'qml') {
                previewTitle.innerHTML = '<i class="fa-solid fa-cubes"></i> Qt Quick Window (Interactive)';
                
                previewFrame.srcdoc = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <style>
                        body { margin:0; padding:20px; background:#2b2b2b; color:#ffffff; font-family:"Segoe UI", sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; box-sizing:border-box; user-select:none; }
                        .qt-window { background:#3c3f41; border:1px solid #555; border-radius:6px; box-shadow:0 4px 15px rgba(0,0,0,0.5); width:100%; height:100%; display:flex; flex-direction:column; overflow:hidden; }
                        .qt-titlebar { background:#282b2c; padding:6px 12px; font-size:12px; font-weight:bold; border-bottom:1px solid #444; display:flex; justify-content:space-between; align-items:center; }
                        .qt-content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:20px; }
                        .qt-btn { background:#4a4e52; color:#fff; border:1px solid #5a5e62; border-radius:4px; padding:8px 18px; font-size:13px; cursor:pointer; font-weight:500; transition:0.1s; }
                        .qt-btn:hover { background:#5a5e62; }
                        .qt-btn:active { background:#3a3e42; transform:scale(0.98); }
                    </style>
                </head>
                <body>
                    <div class="qt-window">
                        <div class="qt-titlebar"><span>Qt Quick ApplicationWindow</span><span style="color:#888;">✕</span></div>
                        <div class="qt-content" id="qt-root"></div>
                    </div>
                    <script>
                        const qml = ${JSON.stringify(code)};
                        const state = {};

                        // property <type> <name>: <value> の抽出
                        const propRegex = /property\\s+[a-zA-Z0-9_]+\\s+([a-zA-Z0-9_]+)\\s*:\\s*(.+)/g;
                        let m;
                        while ((m = propRegex.exec(qml)) !== null) {
                            try { state[m[1]] = eval(m[2]); } catch(e) { state[m[1]] = m[2]; }
                        }

                        window.runQtAction = function(action) {
                            with(state) { eval(action); }
                            renderQt();
                        };

                        function renderQt() {
                            const root = document.getElementById('qt-root');
                            let html = '';

                            // Text { text: ... } の抽出
                            const textRegex = /Text\\s*\\{[\\s\\S]*?text:\\s*([^\\n\\}]+)/g;
                            while ((m = textRegex.exec(qml)) !== null) {
                                let expr = m[1].trim();
                                let val = expr;
                                try {
                                    with(state) { val = eval(expr); }
                                } catch(e) {}
                                html += '<div style="font-size:16px; font-weight:600;">' + val + '</div>';
                            }

                            // Button { text: ..., onClicked: { ... } } の抽出
                            const btnRegex = /Button\\s*\\{[\\s\\S]*?text:\\s*["']([^"']+)["'][\\s\\S]*?onClicked:\\s*\\{([\\s\\S]*?)\\}/g;
                            while ((m = btnRegex.exec(qml)) !== null) {
                                const title = m[1];
                                const action = m[2].trim().replace(/\\n/g, ';');
                                html += '<button class="qt-btn" onclick="runQtAction(\\\`' + action + '\\\`)">' + title + '</button>';
                            }

                            root.innerHTML = html;
                        }
                        renderQt();
                    </` + `script>
                </body>
                </html>`;
                return;
            }

            // --- 2. SwiftUI インタラクティブ実行ランタイム ---
            if (ext === 'swift') {
                previewTitle.innerHTML = '<i class="fa-brands fa-apple"></i> SwiftUI Simulator';
                previewFrame.srcdoc = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <script src="https://cdn.tailwindcss.com"></` + `script>
                    <style>
                        body { margin:0; padding:20px; font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#f2f2f7; user-select:none; }
                        .swift-btn { transition: transform 0.1s ease, opacity 0.1s; cursor: pointer; font-weight:600; text-align:center; }
                        .swift-btn:active { transform: scale(0.96); opacity: 0.8; }
                    </style>
                </head>
                <body>
                    <div id="root" class="w-full flex flex-col items-center justify-center"></div>
                    <script>
                        const rawCode = ${JSON.stringify(code)};
                        const state = {};

                        const stateRegex = /@State\\s+var\\s+([a-zA-Z0-9_]+)\\s*(?::\\s*[a-zA-Z0-9_]+)?\\s*=\\s*(.+)/g;
                        let match;
                        while ((match = stateRegex.exec(rawCode)) !== null) {
                            try { state[match[1]] = eval(match[2].trim()); } catch(e) { state[match[1]] = match[2].trim().replace(/"/g, ''); }
                        }

                        window.handleAction = function(actionCode) {
                            try {
                                with (state) { eval(actionCode); }
                                render();
                            } catch(err) { console.error(err); }
                        };

                        function render() {
                            const root = document.getElementById('root');
                            let html = '<div class="flex flex-col items-center justify-center gap-4 w-full">';

                            const textRegex = /Text\\("([^"]+)"\\)((?:\\.[a-zA-Z0-9_]+\\([^)]*\\))*)/g;
                            while ((match = textRegex.exec(rawCode)) !== null) {
                                let textContent = match[1].replace(/\\\\\\(([a-zA-Z0-9_]+)\\)/g, (_, v) => state[v] !== undefined ? state[v] : '');
                                html += '<div class="text-base text-gray-900 font-medium">' + textContent + '</div>';
                            }

                            const btnRegex = /Button\\("([^"]+)"\\)\\s*\\{([\\s\\S]*?)\\}/g;
                            while ((match = btnRegex.exec(rawCode)) !== null) {
                                const btnTitle = match[1];
                                const btnAction = match[2].trim().replace(/\\n/g, ';');
                                html += '<button onclick="handleAction(\\\`' + btnAction + '\\\`)" class="swift-btn px-6 py-2.5 bg-blue-600 text-white rounded-xl shadow">' + btnTitle + '</button>';
                            }

                            html += '</div>';
                            root.innerHTML = html;
                        }
                        render();
                    </` + `script>
                </body>
                </html>`;
            }
        }

        document.getElementById('render-ui-btn').onclick = executeUIRuntime;

        const previewPanel = document.getElementById('preview-panel');
        document.getElementById('toggle-preview-btn').onclick = () => {
            previewPanel.style.display = previewPanel.style.display === 'none' ? 'flex' : 'none';
        };

        const overlay = document.getElementById('modal-overlay');
        const input = document.getElementById('quick-input');
        const label = document.getElementById('quick-input-label');
        let currentAction = null;

        function showPrompt(title, onConfirm) {
            label.innerText = title;
            input.value = "";
            overlay.style.display = 'block';
            input.focus();
            currentAction = onConfirm;
        }

        input.onkeydown = (e) => {
            if (e.key === 'Enter') {
                const val = input.value.trim();
                overlay.style.display = 'none';
                if (val && currentAction) currentAction(val);
            } else if (e.key === 'Escape') {
                overlay.style.display = 'none';
            }
        };

        document.getElementById('new-file-btn').onclick = () => {
            showPrompt("新規ファイル名 (例: main.go, app.rs, ui.qml, View.swift)", async (name) => {
                await fetch('/api/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: name, isDir: false })
                });
                await loadTree();
                openFile(name);
            });
        };

        document.getElementById('new-folder-btn').onclick = () => {
            showPrompt("新規フォルダ名", async (name) => {
                await fetch('/api/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: name, isDir: true })
                });
                await loadTree();
            });
        };

        document.getElementById('refresh-tree-btn').onclick = loadTree;
        document.getElementById('clear-term').onclick = () => output.innerText = "";

        // ★ プロジェクト単位の一括ビルド＆実行
        document.getElementById('sidebar-run-btn').onclick = async () => {
            if (!activePath) return;
            output.innerText = `[Building Project] ${activePath} ...\n-----------------------------------`;
            await saveFile();

            const startTime = performance.now();
            try {
                const res = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: activePath })
                });
                const result = await res.text();
                const duration = ((performance.now() - startTime) / 1000).toFixed(2);
                output.innerText = result + `\n\n-----------------------------------\n[Project Build Finished in ${duration}s]`;
            } catch (err) {
                output.innerText = `実行エラー: ${err}`;
            }
        };
    </script>
</body>
</html>
