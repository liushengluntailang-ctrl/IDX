<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpine Custom Project IDX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; height: 100vh; background: #1e1e1e; color: #ccc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; position: relative; }
        #activity-bar { width: 48px; min-width: 48px; background: #333; display: flex; flex-direction: column; align-items: center; padding-top: 5px; border-right: 1px solid #252525; z-index: 30; }
        .act-btn { width: 48px; height: 48px; display: flex; justify-content: center; align-items: center; color: #858585; cursor: pointer; font-size: 19px; }
        .act-btn:hover, .act-btn.active { color: #fff; }
        .act-btn.active { border-left: 2px solid #007acc; }
        .act-btn.ai-btn { color: #c678dd; }
        #sidebar { width: 240px; min-width: 240px; background: #252526; display: flex; flex-direction: column; border-right: 1px solid #191919; z-index: 20; }
        .sidebar-header { padding: 10px 15px; font-size: 11px; font-weight: bold; text-transform: uppercase; color: #bbb; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .sidebar-actions i { margin-left: 10px; cursor: pointer; font-size: 13px; }
        .sidebar-actions i:hover { color: #fff; }
        #file-tree { flex: 1; overflow-y: auto; list-style: none; padding-top: 5px; }
        .tree-item { padding: 6px 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .tree-item:hover { background: #2a2d2e; }
        .tree-item.active { background: #37373d; color: #fff; border-left: 2px solid #007acc; }
        .tree-item .del { display: none; color: #e06c75; font-size: 12px; }
        .tree-item:hover .del { display: block; }
        #workspace-area { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; min-width: 0; }
        #tabs-bar { height: 35px; background: #252526; display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid #1e1e1e; font-size: 13px; color: #fff; white-space: nowrap; overflow-x: auto; }
        #monaco-editor { flex: 1; width: 100%; min-height: 0; }
        #terminal-panel { height: 180px; background: #141414; border-top: 1px solid #333; display: flex; flex-direction: column; font-family: "Consolas", monospace; }
        #terminal-header { height: 26px; background: #1e1e1e; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 11px; font-weight: bold; color: #aaa; border-bottom: 1px solid #2a2a2a; }
        #terminal-body { flex: 1; padding: 8px 12px; overflow-y: auto; font-size: 12px; color: #d4d4d4; white-space: pre-wrap; }
        #terminal-input-line { display: flex; align-items: center; background: #181818; padding: 4px 10px; border-top: 1px solid #282828; }
        #cmd-input { flex: 1; background: transparent; border: none; color: #fff; font-family: inherit; font-size: 12px; outline: none; margin-left: 6px; }
        #copilot-panel { width: 330px; min-width: 330px; background: #21252b; border-left: 1px solid #181a1f; display: flex; flex-direction: column; z-index: 20; }
        #copilot-header { padding: 10px 15px; background: #282c34; border-bottom: 1px solid #181a1f; font-size: 12px; font-weight: bold; color: #c678dd; display: flex; justify-content: space-between; align-items: center; }
        #copilot-settings { padding: 10px; background: #1e2227; border-bottom: 1px solid #181a1f; display: flex; flex-direction: column; gap: 8px; font-size: 11px; }
        #copilot-settings select, #custom-model { width: 100%; background: #282c34; border: 1px solid #3e4451; color: #fff; padding: 5px; border-radius: 3px; font-size: 11px; outline: none; }
        .setting-checkbox { display: flex; align-items: center; gap: 6px; color: #aaa; cursor: pointer; }
        #copilot-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; }
        .chat-bubble { padding: 8px 12px; border-radius: 6px; line-height: 1.4; word-break: break-word; }
        .chat-user { background: #3e4451; color: #fff; align-self: flex-end; max-width: 85%; }
        .chat-ai { background: #282c34; border: 1px solid #3e4451; color: #abb2bf; align-self: flex-start; max-width: 95%; }
        .action-log { color: #98c379; font-family: monospace; font-size: 11px; margin-top: 4px; display: block; }
        #copilot-input-area { padding: 10px; background: #282c34; border-top: 1px solid #181a1f; display: flex; flex-direction: column; gap: 8px; }
        #copilot-input { width: 100%; height: 65px; background: #1e2227; border: 1px solid #3e4451; color: #fff; padding: 8px; font-size: 12px; border-radius: 4px; resize: none; outline: none; }
        #copilot-send-btn { background: #c678dd; color: #fff; border: none; padding: 8px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        #modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: rgba(0,0,0,0.5); }
        #quick-input-box { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 480px; background: #252526; border: 1px solid #007acc; box-shadow: 0 8px 24px rgba(0,0,0,0.8); padding: 10px; display: flex; flex-direction: column; gap: 8px; border-radius: 4px; }
        #quick-input-header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #aaa; }
        #quick-input { width: 100%; background: #3c3c3c; border: 1px solid #3c3c3c; color: #fff; font-size: 13px; padding: 7px 10px; outline: none; border-radius: 2px; }
        @media (max-width: 768px) {
            #sidebar { position: absolute; top: 0; left: 48px; height: 100%; width: calc(100% - 48px); max-width: 280px; box-shadow: 4px 0 15px rgba(0,0,0,0.5); display: none; }
            #copilot-panel { position: absolute; top: 0; right: 0; height: 100%; width: 100%; max-width: 320px; box-shadow: -4px 0 15px rgba(0,0,0,0.5); display: none; }
            #terminal-panel { height: 140px; }
            .tree-item { padding: 10px 15px; }
        }
    </style>
</head>
<body>

    <div id="modal-overlay">
        <div id="quick-input-box" onclick="event.stopPropagation()">
            <div id="quick-input-header">
                <span id="quick-input-label">名前を入力</span>
                <i class="fa-solid fa-xmark" id="quick-close-btn" style="cursor:pointer;" title="閉じる"></i>
            </div>
            <input type="text" id="quick-input" autocomplete="off" />
        </div>
    </div>

    <div id="activity-bar">
        <div class="act-btn active" id="btn-toggle-explorer" title="Explorer"><i class="fa-regular fa-copy"></i></div>
        <div class="act-btn ai-btn" id="btn-toggle-copilot" title="AI Copilot"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <span>EXPLORER</span>
            <div class="sidebar-actions">
                <i class="fa-solid fa-file-circle-plus" id="btn-new-file" title="新規ファイル"></i>
                <i class="fa-solid fa-folder-plus" id="btn-new-folder" title="新規フォルダ"></i>
                <i class="fa-solid fa-rotate" id="btn-refresh" title="更新"></i>
            </div>
        </div>
        <ul id="file-tree"></ul>
    </div>

    <div id="workspace-area">
        <div id="tabs-bar"><span id="tab-filename">ファイルを選択してください</span></div>
        <div id="monaco-editor"></div>
        <div id="terminal-panel">
            <div id="terminal-header">
                <span>TERMINAL</span>
                <span id="btn-clear-term" style="cursor:pointer;"><i class="fa-solid fa-ban"></i></span>
            </div>
            <div id="terminal-body">// ターミナル準備完了。「copilot 指示」で直接AI操作可能。</div>
            <div id="terminal-input-line">
                <span style="color:#4ec9b0; font-weight:bold;">alpine#</span>
                <input type="text" id="cmd-input" placeholder="ls -la, dotnet run, または copilot [指示]..." autocomplete="off" />
            </div>
        </div>
    </div>

    <div id="copilot-panel">
        <div id="copilot-header">
            <span><i class="fa-solid fa-robot"></i> COPILOT AGENT</span>
            <i class="fa-solid fa-xmark" id="btn-close-copilot" style="cursor:pointer;" title="閉じる"></i>
        </div>
        <div id="copilot-settings">
            <label style="color:#aaa;">AI Model (稼働中無料モデル):</label>
            <select id="agent-model">
                <option value="recursive/flint:free" selected>Recursive Flint (無料・コード特化エージェント)</option>
                <option value="google/gemini-2.0-flash-exp:free">Gemini 2.0 Flash (無料・爆速)</option>
                <option value="meta-llama/llama-3.2-3b-instruct:free">Llama 3.2 3B (無料・軽量版)</option>
                <option value="custom">-- 直接モデル名を入力 --</option>
            </select>
            <input type="text" id="custom-model" placeholder="例: deepseek/deepseek-chat:free" style="display:none;" />
            <label class="setting-checkbox">
                <input type="checkbox" id="allow-cmd-exec" checked />
                <span>コマンドの自動実行を許可する</span>
            </label>
        </div>
        <div id="copilot-messages">
            <div class="chat-bubble chat-ai">既存のコードを読み取ってファイル作成から実行まで自動で行います！</div>
        </div>
        <div id="copilot-input-area">
            <textarea id="copilot-input" placeholder="例: htmlで簡単なゲームを作って (Ctrl+Enterで送信)"></textarea>
            <button id="copilot-send-btn"><i class="fa-solid fa-bolt"></i> 自動操縦で実行</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script>
        let editor, activePath = "";
        const termBody = document.getElementById("terminal-body");
        const sidebar = document.getElementById('sidebar');
        const copilotPanel = document.getElementById('copilot-panel');
        const btnExplorer = document.getElementById('btn-toggle-explorer');
        const btnCopilot = document.getElementById('btn-toggle-copilot');

        // モデル選択で「直接入力」が選ばれたらテキストボックスを表示
        document.getElementById('agent-model').onchange = (e) => {
            document.getElementById('custom-model').style.display = e.target.value === 'custom' ? 'block' : 'none';
        };

        btnExplorer.onclick = () => {
            const isHidden = window.getComputedStyle(sidebar).display === 'none';
            sidebar.style.display = isHidden ? 'flex' : 'none';
            btnExplorer.classList.toggle('active', isHidden);
            if (window.innerWidth <= 768 && isHidden) copilotPanel.style.display = 'none';
            if (editor) editor.layout();
        };

        function toggleCopilot(forceOpen = false) {
            const isHidden = window.getComputedStyle(copilotPanel).display === 'none';
            const shouldOpen = forceOpen ? true : isHidden;
            copilotPanel.style.display = shouldOpen ? 'flex' : 'none';
            btnCopilot.classList.toggle('active', shouldOpen);
            if (window.innerWidth <= 768 && shouldOpen) sidebar.style.display = 'none';
            if (editor) editor.layout();
        }
        btnCopilot.onclick = () => toggleCopilot();
        document.getElementById('btn-close-copilot').onclick = () => toggleCopilot(false);

        const overlay = document.getElementById('modal-overlay');
        const quickInput = document.getElementById('quick-input');
        const quickLabel = document.getElementById('quick-input-label');
        let quickCallback = null;

        function showQuickPrompt(title, placeholder, cb) {
            quickLabel.innerText = title;
            quickInput.placeholder = placeholder;
            quickInput.value = "";
            overlay.style.display = 'block';
            quickInput.focus();
            quickCallback = cb;
        }
        function closeQuickPrompt() {
            overlay.style.display = 'none';
            quickCallback = null;
        }

        quickInput.onkeydown = (e) => {
            if (e.key === 'Enter') {
                const val = quickInput.value.trim();
                const cb = quickCallback;
                closeQuickPrompt();
                if (val && cb) cb(val);
            } else if (e.key === 'Escape') closeQuickPrompt();
        };
        document.getElementById('quick-close-btn').onclick = closeQuickPrompt;
        overlay.onclick = (e) => { if (e.target === overlay) closeQuickPrompt(); };

        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('monaco-editor'), {
                value: '// IDE Ready',
                language: 'plaintext',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14
            });
            editor.onDidChangeModelContent(() => { if (activePath) setTimeout(saveFile, 500); });
            loadTree(true);
        });

        async function saveFile() {
            if (!activePath) return;
            await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: activePath, content: editor.getValue() })
            });
        }

        async function loadTree(openFirst = false) {
            try {
                const res = await fetch('/api/files');
                const files = await res.json();
                const tree = document.getElementById('file-tree');
                tree.innerHTML = "";
                if (!files || files.length === 0) return;

                files.forEach(f => {
                    const li = document.createElement('li');
                    li.className = 'tree-item' + (f.path === activePath ? ' active' : '');
                    const icon = f.isDir ? 'fa-regular fa-folder' : 'fa-regular fa-file-code';
                    li.innerHTML = `<span><i class="${icon}"></i> ${f.path}</span><i class="fa-solid fa-trash del" title="削除"></i>`;
                    
                    if (!f.isDir) {
                        li.onclick = () => {
                            openFile(f.path);
                            if (window.innerWidth <= 768) sidebar.style.display = 'none';
                        };
                    }
                    li.querySelector('.del').onclick = async (e) => {
                        e.stopPropagation();
                        if (confirm(`本当に "${f.path}" を削除しますか？`)) {
                            await fetch('/api/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: f.path }) });
                            loadTree();
                        }
                    };
                    tree.appendChild(li);
                });

                if (openFirst && !activePath && files.length > 0) {
                    const target = files.find(f => !f.isDir && f.name === 'Program.cs') || files.find(f => !f.isDir);
                    if (target) openFile(target.path);
                }
            } catch(e) { console.error(e); }
        }

        async function openFile(path) {
            activePath = path;
            document.getElementById('tab-filename').innerText = path;
            try {
                const res = await fetch(`/api/load?path=${encodeURIComponent(path)}`);
                const content = await res.text();
                const ext = path.split('.').pop().toLowerCase();
                const langs = { cs:'csharp', py:'python', go:'go', rs:'rust', js:'javascript', html:'html', svg:'xml', xml:'xml' };
                
                const oldModel = editor.getModel();
                if (oldModel) oldModel.dispose();
                const newModel = monaco.editor.createModel(content, langs[ext] || 'plaintext');
                editor.setModel(newModel);
            } catch(e) { console.error(e); }

            document.querySelectorAll('.tree-item').forEach(el => {
                const span = el.querySelector('span');
                if (span) el.classList.toggle('active', span.innerText.includes(path));
            });
        }

        document.getElementById('btn-new-file').onclick = () => {
            showQuickPrompt("新規ファイル作成 (Escで取消)", "例: main.cs, app.py, index.html", async (name) => {
                await fetch('/api/create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: name, isDir: false }) });
                await loadTree();
                openFile(name);
            });
        };

        document.getElementById('btn-new-folder').onclick = () => {
            showQuickPrompt("新規フォルダ作成 (Escで取消)", "例: src, components, assets", async (name) => {
                await fetch('/api/create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: name, isDir: true }) });
                await loadTree();
            });
        };

        document.getElementById('btn-refresh').onclick = () => loadTree();
        document.getElementById('btn-clear-term').onclick = () => termBody.innerText = "";

        document.getElementById('cmd-input').onkeydown = async (e) => {
            if (e.key === 'Enter') {
                const inputVal = e.target.value.trim();
                if (!inputVal) return;
                e.target.value = "";

                if (inputVal.startsWith("copilot ") || inputVal.startsWith("copilot:")) {
                    const prompt = inputVal.replace(/^copilot[:\s]+/, "");
                    termBody.innerText += `\nalpine# ${inputVal}\n[Copilot] 指示を受信: "${prompt}"\n`;
                    toggleCopilot(true);
                    runAgent(prompt);
                    return;
                }

                termBody.innerText += `\nalpine# ${inputVal}\n`;
                const res = await fetch('/api/cmd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cmd: inputVal }) });
                termBody.innerText += await res.text();
                termBody.scrollTop = termBody.scrollHeight;
                loadTree();
            }
        };

        document.getElementById('copilot-send-btn').onclick = () => {
            const prompt = document.getElementById('copilot-input').value.trim();
            if (prompt) runAgent(prompt);
        };
        document.getElementById('copilot-input').onkeydown = (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                const prompt = document.getElementById('copilot-input').value.trim();
                if (prompt) runAgent(prompt);
            }
        };

        async function runAgent(prompt) {
            let model = document.getElementById('agent-model').value;
            if (model === 'custom') {
                model = document.getElementById('custom-model').value.trim() || 'recursive/flint:free';
            }
            const allowCmd = document.getElementById('allow-cmd-exec').checked;

            const msgBox = document.getElementById('copilot-messages');
            msgBox.innerHTML += `<div class="chat-bubble chat-user">${prompt}</div>`;
            const aiMsg = document.createElement('div');
            aiMsg.className = 'chat-bubble chat-ai';
            aiMsg.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> コードを分析してプラン考案中...';
            msgBox.appendChild(aiMsg);
            document.getElementById('copilot-input').value = "";
            msgBox.scrollTop = msgBox.scrollHeight;

            const currentCode = editor ? editor.getValue() : "";
            const currentFile = activePath || "なし";

            const systemPrompt = `あなたはIDEを完全自動操作する自律エージェントです。
現在開いているファイル: ${currentFile}

ユーザーの指示を満たすため、必ず以下のJSON配列フォーマットのみを出力してください。前置きや解説は一切出力してはなりません。

[
  {"action": "create", "path": "ファイル名"},
  {"action": "write", "path": "ファイル名", "content": "完全なソースコード"},
  {"action": "cmd", "command": "実行コマンド (例: dotnet run)"}
]`;

            const userPrompt = `【現在開いているファイルの内容】
${currentCode}

【ユーザー指示】
${prompt}`;

            try {
                const res = await fetch('/api/ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userPrompt }
                        ]
                    })
                });

                const data = await res.json();
                if (data.error) {
                    aiMsg.innerHTML = `<span style="color:#e06c75;">エラー: ${data.error.message || JSON.stringify(data.error)}</span>`;
                    return;
                }

                const rawText = data.choices[0].message.content;
                const jsonMatch = rawText.match(/\[[\s\S]*\]/);
                if (!jsonMatch) {
                    aiMsg.innerHTML = `<div>直接出力:</div><pre style="font-size:11px;">${rawText}</pre>`;
                    return;
                }

                const actions = JSON.parse(jsonMatch[0]);
                aiMsg.innerHTML = '<strong>🚀 自動操作を実行中:</strong>';

                for (const act of actions) {
                    if (act.action === "create") {
                        aiMsg.innerHTML += `<span class="action-log">📁 作成: ${act.path}</span>`;
                        await fetch('/api/create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: act.path, isDir: false }) });
                        await loadTree();
                    } else if (act.action === "write") {
                        aiMsg.innerHTML += `<span class="action-log">✍ 書込: ${act.path}</span>`;
                        await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: act.path, content: act.content }) });
                        await openFile(act.path);
                    } else if (act.action === "cmd") {
                        if (allowCmd) {
                            aiMsg.innerHTML += `<span class="action-log">⚡ 実行: ${act.command}</span>`;
                            termBody.innerText += `\n[Agent Exec] ${act.command}\n`;
                            const cmdRes = await fetch('/api/cmd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cmd: act.command }) });
                            termBody.innerText += await cmdRes.text() + "\n";
                            termBody.scrollTop = termBody.scrollHeight;
                        } else {
                            aiMsg.innerHTML += `<span class="action-log" style="color:#e5c07b;">⚠ スキップ (コマンド不許可): ${act.command}</span>`;
                        }
                    }
                    msgBox.scrollTop = msgBox.scrollHeight;
                }

                aiMsg.innerHTML += '<span class="action-log" style="color:#4ec9b0; font-weight:bold;">✔ 完了しました！</span>';
            } catch (err) {
                aiMsg.innerHTML = `<span style="color:#e06c75;">通信エラー: ${err}</span>`;
            }
        }
    </script>
</body>
</html>
